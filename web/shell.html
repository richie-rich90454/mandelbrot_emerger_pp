<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandelbrot Emerger</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;outline:none}
#isolation{position:fixed;inset:0;display:none;place-items:center;padding:2rem;box-sizing:border-box;
    color:#e8e8e8;background:#000;font:15px/1.6 system-ui,sans-serif;text-align:center;white-space:pre-line}
</style>
<script src="coi-serviceworker.js"></script>
<script>
window.addEventListener("load", function(){
    if(!window.crossOriginIsolated){
        document.getElementById("isolation").style.display="grid";
    }
});
</script>
</head>
<body>
<div id="isolation">WebAssembly threads need cross-origin isolation.

Serve this page with COOP/COEP headers, or over localhost/HTTPS so the bundled service worker can provide them.</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
{{{ SCRIPT }}}
</body>
</html>
