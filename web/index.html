<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandelbrot Emerger</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;outline:none}
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
(function(){
    // The page can be reached as a directory ("/app/"), an index file ("/app/index.html") or an extension-less
    // route ("/app"), under any mount prefix, so every asset resolves against this page's own directory instead
    // of the browser's default relative resolution, which would strip the prefix on the extension-less form.
    var path=location.pathname;
    var slash=path.lastIndexOf("/");
    var base;
    if(path.charAt(path.length-1)==="/"){
        base=path;
    }
    else if(path.substring(slash+1).indexOf(".")>=0){
        base=path.substring(0,slash+1);
    }
    else{
        base=path+"/";
    }
    var booted=false;
    function boot(source){
        if(booted){
            return;
        }
        booted=true;
        var script=document.createElement("script");
        script.src=base+source;
        document.body.appendChild(script);
    }
    // The threaded build pre-spawns pthread workers from its own URL, and under COEP the browser requires every
    // worker script response to repeat the COEP header - hosts normally send it only on the page, so the workers
    // would be blocked and the app would never start. Sourcing the module from a blob keeps worker startup local,
    // and locateFile points the wasm back at the real file. If that chain fails, the plain URL is tried and then
    // the single-threaded module.
    function bootThreadedPlain(){
        if(booted){
            return;
        }
        booted=true;
        var script=document.createElement("script");
        script.src=base+"threaded.js";
        script.onerror=function(){
            booted=false;
            boot("fallback.js");
        };
        document.body.appendChild(script);
    }
    function bootThreaded(){
        if(booted){
            return;
        }
        booted=true;
        fetch(base+"threaded.js").then(function(response){
            if(!response.ok){
                throw new Error("threaded.js "+response.status);
            }
            return response.text();
        }).then(function(source){
            var blobUrl=URL.createObjectURL(new Blob([source], {type: "text/javascript"}));
            window.Module={locateFile:function(file){ return base+file; }};
            var script=document.createElement("script");
            script.src=blobUrl;
            script.onerror=function(){
                booted=false;
                bootThreadedPlain();
            };
            document.body.appendChild(script);
        }).catch(function(){
            booted=false;
            bootThreadedPlain();
        });
    }
    // The threaded build needs SharedArrayBuffer, so it needs COOP/COEP headers. When the page is already
    // crossOriginIsolated (host headers or the service worker below) it runs. On localhost/HTTPS the bundled
    // worker injects those headers and reloads once, but only when this page falls inside its scope: a route
    // such as "/app" without the trailing slash is outside the "/app/" scope and would reload forever, so it
    // goes straight to the single-threaded build. Everywhere else - plain HTTP, file://, private mode, browsers
    // without service workers - the single-threaded module runs too. No server configuration is ever required.
    if(window.crossOriginIsolated){
        bootThreaded();
        return;
    }
    if(window.isSecureContext && "serviceWorker" in navigator && path.indexOf(base)===0){
        var fallbackTimer=setTimeout(function(){ boot("fallback.js"); }, 4000);
        var script=document.createElement("script");
        script.src=base+"coi-serviceworker.js";
        script.onerror=function(){
            clearTimeout(fallbackTimer);
            boot("fallback.js");
        };
        document.body.appendChild(script);
        return;
    }
    boot("fallback.js");
})();
</script>
</body>
</html>
